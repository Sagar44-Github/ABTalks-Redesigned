<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>ABTalks — Brutalist Command Center</title>

  <!-- dark canvas background matching the app's dark-mode background token -->
  <rect width="1200" height="320" fill="#121110"/>

  <!-- subtle grid-line overlay, matching the app's background texture -->
  <g stroke="#2a2825" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
    <line x1="1100" y1="0" x2="1100" y2="320"/>
  </g>

  <!-- AB monogram, same construction as the app logo, dark-mode colors -->
  <rect x="74" y="74" width="90" height="90" fill="#FFFFFF"/>
  <rect x="68" y="68" width="90" height="90" fill="#FFD84D" stroke="#F0EDE6" stroke-width="5"/>
  <path d="M90 138 L102 88 L108 88 L98 138 Z" fill="#121110"/>
  <rect x="92" y="118" width="16" height="6" fill="#121110"/>
  <rect x="118" y="88" width="7" height="50" fill="#121110"/>
  <path d="M125 88 L138 88 Q145 88 145 96 Q145 103 138 103 L125 103 Z" fill="#121110"/>
  <path d="M125 103 L140 103 Q147 103 147 111 Q147 138 140 138 L125 138 Z" fill="#121110"/>

  <!-- wordmark -->
  <text x="200" y="128" font-family="Arial Black, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="-2" fill="#F0EDE6">ABTALKS</text>
  <text x="200" y="162" font-family="Courier New, monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#FFD84D">BRUTALIST COMMAND CENTER</text>

  <!-- tricolor accent bar, hard offset style -->
  <rect x="200" y="185" width="80" height="10" fill="#FFD84D"/>
  <rect x="284" y="185" width="80" height="10" fill="#FF5A46"/>
  <rect x="368" y="185" width="80" height="10" fill="#4D8AFF"/>

  <!-- right-side stat callouts, mono-label style -->
  <g font-family="Courier New, monospace" font-weight="700" fill="#F0EDE6">
    <text x="900" y="90" font-size="12" fill="#8a8680">ROUTES</text>
    <text x="900" y="118" font-size="34" font-weight="900" fill="#FFD84D">13</text>

    <text x="1010" y="90" font-size="12" fill="#8a8680">DAY CYCLE</text>
    <text x="1010" y="118" font-size="34" font-weight="900" fill="#4D8AFF">60</text>

    <text x="900" y="180" font-size="12" fill="#8a8680">DESIGN</text>
    <text x="900" y="205" font-size="20" font-weight="900" fill="#FF5A46">ZERO RADIUS</text>

    <text x="900" y="245" font-size="12" fill="#8a8680">AI ENGINE</text>
    <text x="900" y="270" font-size="20" font-weight="900" fill="#F0EDE6">GROQ / GROK</text>
  </g>

  <!-- bottom border, hard edge -->
  <rect x="0" y="316" width="1200" height="4" fill="#FFD84D"/>
</svg>
